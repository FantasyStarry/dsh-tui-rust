# The Orca bundle patch: an interactive terminal front door over the dsh-base
# layer. Applied after dsh-base's insert; rows here override base rows by id.
#
# Orca never modifies the kernel: every capability is consumed through the
# in-process Cordis seams (agents, workspaceRegistry, session events). The
# TUI creates or resumes its agent at runtime through the agent factory —
# no declarative agents are started at boot.

# ── surface-specific values over the dsh-base layer ──────────────────────────

# The Orca deployment persona; ORCA_PERSONA overrides the coding-agent default.
# A patch replaces the targeted row's whole config — restate every key you own.
- id: system-prompt
  config:
    persona: !!js process.env.ORCA_PERSONA ?? 'You are a coding agent.'

# ── the interactive front door ────────────────────────────────────────────────

- insert:
    # Entry-level inject only; the plugin module's own code-level inject stays
    # empty so a stale patch cannot deadlock a composition lacking these
    # services (#183 pattern from the dsh-TUI ecosystem spec). Only list
    # services Orca actually requires: `workspaceRegistry` is NOT loaded by
    # every profile composition — injecting it left the plugin pending
    # forever and failed the boot (dsh 0.1.1-rc.2, verified in-profile).
    # Optional seams beyond `agents` are soft-probed and degrade silently.
    - id: orca
      name: 'dsh-orca'
      inject: [agents]
      config:
        # LLM route override; empty = the composition default
        # (agentDefaultModel). provider+model must be set together.
        provider: !!js process.env.ORCA_PROVIDER ?? ''
        model: !!js process.env.ORCA_MODEL ?? ''
        # Alternate-screen fullscreen is the target experience; inline
        # (main screen, terminal-managed scrollback) is the skeleton default
        # until scroll/mouse/selection mature. Flip via ORCA_FULLSCREEN=1
        # or this config once fullscreen mode lands.
        fullscreen: !!js process.env.ORCA_FULLSCREEN === '1'
