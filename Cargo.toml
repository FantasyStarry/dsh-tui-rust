[package]
name = "dsh-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI client for DeepSeek Harness — Phase 0 ACP spike"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
strip = true
